<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" rx="16" fill="#0b1220"/>
  <!-- browser shell -->
  <rect x="150" y="80" width="500" height="290" rx="12" fill="#f1f5f9"/>
  <rect x="150" y="80" width="500" height="36" rx="12" fill="#cbd5e1"/>
  <rect x="170" y="88" width="300" height="20" rx="10" fill="#f8fafc"/>
  <!-- loading skeletons (shimmer) -->
  <g fill="#cbd5e1">
    <rect x="170" y="140" width="220" height="16" rx="8" opacity="0.6">
      <animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" values="0.3;0.9;0.3"/>
    </rect>
    <rect x="170" y="164" width="340" height="12" rx="6" opacity="0.6">
      <animate attributeName="opacity" dur="1.6s" begin="0.2s" repeatCount="indefinite" values="0.3;0.9;0.3"/>
    </rect>
    <rect x="170" y="182" width="280" height="12" rx="6" opacity="0.6">
      <animate attributeName="opacity" dur="1.6s" begin="0.4s" repeatCount="indefinite" values="0.3;0.9;0.3"/>
    </rect>
    <rect x="170" y="216" width="150" height="90" rx="8" opacity="0.6">
      <animate attributeName="opacity" dur="1.6s" begin="0.1s" repeatCount="indefinite" values="0.3;0.9;0.3"/>
    </rect>
    <rect x="330" y="216" width="150" height="90" rx="8" opacity="0.6">
      <animate attributeName="opacity" dur="1.6s" begin="0.5s" repeatCount="indefinite" values="0.3;0.9;0.3"/>
    </rect>
  </g>
  <rect x="490" y="300" width="140" height="40" rx="8" fill="#2563eb"/>
  <!-- click ripples: 12→80px diameter -->
  <g fill="none" stroke="#2563eb" stroke-width="3">
    <circle cx="245" cy="261" r="6" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.28;0.30;0.38;1"/>
      <animate attributeName="r" dur="8s" repeatCount="indefinite" values="6;6;6;40;40" keyTimes="0;0.28;0.30;0.38;1"/>
    </circle>
    <circle cx="405" cy="261" r="6" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.50;0.52;0.60;1"/>
      <animate attributeName="r" dur="8s" repeatCount="indefinite" values="6;6;6;40;40" keyTimes="0;0.50;0.52;0.60;1"/>
    </circle>
    <circle cx="560" cy="320" r="6" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.70;0.72;0.80;1"/>
      <animate attributeName="r" dur="8s" repeatCount="indefinite" values="6;6;6;40;40" keyTimes="0;0.70;0.72;0.80;1"/>
    </circle>
  </g>
  <!-- blue cursor + pill, glides between clicks -->
  <g opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.03;0.08;0.88;0.93;1"/>
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" values="200 150;200 150;245 261;405 261;560 320;560 320;200 150" keyTimes="0;0.15;0.30;0.52;0.72;0.88;1"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="8s" repeatCount="indefinite" values="0 3 2;0 3 2;18 3 2;0 3 2;0 3 2;18 3 2;0 3 2;0 3 2;18 3 2;0 3 2;0 3 2" keyTimes="0;0.28;0.32;0.36;0.48;0.52;0.56;0.68;0.72;0.76;1"/>
      <polygon points="3,2 3,23 22,12" fill="#2563eb" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="28" y="30" width="120" height="28" rx="14" fill="#0f172a" opacity="0.9"/>
      <rect x="26" y="28" width="120" height="28" rx="14" fill="#2563eb"/>
      <text x="86" y="47" fill="#ffffff" font-size="13" text-anchor="middle" font-family="Verdana,sans-serif">opening…</text>
    </g>
  </g>
</svg>
